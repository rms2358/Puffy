<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puffy — Your Cloud Pet</title>
<style>
  :root {
    --sky-top: #a7d8ff;
    --sky-bottom: #e8f6ff;
    --cloud: #ffffff;
    --pink: #ffb6d9;
    --accent: #6ab7ff;
    --text: #3a4a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .bg-cloud {
    position: absolute;
    background: white;
    opacity: 0.6;
    border-radius: 50%;
    filter: blur(1px);
    animation: drift linear infinite;
  }
  @keyframes drift {
    from { transform: translateX(-150px); }
    to { transform: translateX(110vw); }
  }
  .card {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(6px);
    border-radius: 32px;
    padding: 32px 28px 24px;
    width: 360px;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 20px 40px rgba(70,120,160,0.25);
    position: relative;
    z-index: 2;
  }
  h1 {
    margin: 0 0 4px;
    color: var(--text);
    font-size: 26px;
  }
  .subtitle {
    color: var(--text);
    opacity: 0.7;
    font-size: 13px;
    margin-bottom: 18px;
  }
  .stage {
    background: linear-gradient(180deg, #eaf7ff, #ffffff);
    border-radius: 24px;
    padding: 20px 10px 10px;
    margin-bottom: 18px;
    position: relative;
    height: 220px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
  }
  .ground {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 26px;
    background: #d7f0e3;
    border-top: 3px solid #bfe6d2;
  }
  .pet {
    width: 130px;
    height: 130px;
    cursor: pointer;
    transition: transform 0.15s ease;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    z-index: 1;
    margin-bottom: 20px;
  }
  .pet:active { transform: scale(0.92); }
  .pet.bounce { animation: bounce 0.5s ease; }
  @keyframes bounce {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-24px) scale(1.05); }
    55% { transform: translateY(0) scale(0.96); }
    75% { transform: translateY(-8px) scale(1.02); }
    100% { transform: translateY(0) scale(1); }
  }
  .pet.wiggle { animation: wiggle 0.4s ease; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
  }
  .pet svg { width: 100%; height: 100%; display: block; }
  .heart-pop {
    position: absolute;
    font-size: 22px;
    pointer-events: none;
    animation: floatUp 1s ease-out forwards;
    z-index: 3;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(0.6); }
    100% { opacity: 0; transform: translateY(-70px) scale(1.2); }
  }
  .bars { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
  }
  .bar-label { width: 62px; text-align: left; font-weight: bold; }
  .bar-track {
    flex: 1;
    height: 12px;
    background: rgba(160,190,210,0.3);
    border-radius: 10px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 10px;
    transition: width 0.4s ease;
  }
  .fill-happy { background: linear-gradient(90deg, #ffd166, #ffb6d9); }
  .fill-energy { background: linear-gradient(90deg, #6ab7ff, #8fe3c0); }
  .fill-hunger { background: linear-gradient(90deg, #a0e6a0, #6ab7ff); }
  .buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    border: none;
    padding: 10px 16px;
    border-radius: 16px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    box-shadow: 0 6px 14px rgba(70,120,160,0.25);
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  button:active { transform: translateY(2px) scale(0.97); }
  .btn-feed { background: linear-gradient(135deg, #ffb6d9, #ff8fc7); }
  .btn-play { background: linear-gradient(135deg, #6ab7ff, #4a9cf0); }
  .btn-sleep { background: linear-gradient(135deg, #a0e6c0, #6fd6a0); }
  .speech {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text);
    min-height: 18px;
    font-style: italic;
  }
  .name-tag {
    display: inline-block;
    background: var(--accent);
    color: white;
    padding: 2px 12px;
    border-radius: 12px;
    font-size: 11px;
    margin-top: 6px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>☁️ Puffy</h1>
  <div class="subtitle">tap Puffy, feed it, play with it, or let it nap</div>

  <div class="stage" id="stage">
    <div class="ground"></div>
    <div class="pet" id="pet" title="Click me!">
      <svg viewBox="0 0 200 200" id="petSvg">
        <ellipse cx="100" cy="150" rx="60" ry="12" fill="#000" opacity="0.06"></ellipse>
        <g id="cloudBody">
          <ellipse cx="100" cy="110" rx="70" ry="50" fill="#ffffff" stroke="#cfe6fb" stroke-width="3"></ellipse>
          <ellipse cx="55" cy="120" rx="35" ry="30" fill="#ffffff" stroke="#cfe6fb" stroke-width="3"></ellipse>
          <ellipse cx="145" cy="120" rx="35" ry="30" fill="#ffffff" stroke="#cfe6fb" stroke-width="3"></ellipse>
          <ellipse cx="100" cy="80" rx="45" ry="38" fill="#ffffff" stroke="#cfe6fb" stroke-width="3"></ellipse>
        </g>
        <g id="face">
          <circle cx="80" cy="105" r="7" fill="#3a4a5a" id="eyeL"></circle>
          <circle cx="120" cy="105" r="7" fill="#3a4a5a" id="eyeR"></circle>
          <circle cx="82" cy="103" r="2" fill="#fff"></circle>
          <circle cx="122" cy="103" r="2" fill="#fff"></circle>
          <path d="M 85 122 Q 100 132 115 122" stroke="#3a4a5a" stroke-width="3" fill="none" stroke-linecap="round" id="mouth"></path>
          <ellipse cx="65" cy="118" rx="8" ry="5" fill="#ffb6d9" opacity="0.7"></ellipse>
          <ellipse cx="135" cy="118" rx="8" ry="5" fill="#ffb6d9" opacity="0.7"></ellipse>
        </g>
      </svg>
    </div>
  </div>

  <div class="bars">
    <div class="bar-row">
      <span class="bar-label">Happy</span>
      <div class="bar-track"><div class="bar-fill fill-happy" id="happyBar" style="width:80%"></div></div>
    </div>
    <div class="bar-row">
      <span class="bar-label">Energy</span>
      <div class="bar-track"><div class="bar-fill fill-energy" id="energyBar" style="width:80%"></div></div>
    </div>
    <div class="bar-row">
      <span class="bar-label">Full</span>
      <div class="bar-track"><div class="bar-fill fill-hunger" id="hungerBar" style="width:80%"></div></div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn-feed" onclick="feedPet()">🍪 Feed</button>
    <button class="btn-play" onclick="playPet()">🎈 Play</button>
    <button class="btn-sleep" onclick="sleepPet()">💤 Nap</button>
  </div>

  <div class="speech" id="speech">Puffy is floating happily~</div>
</div>

<script>
  // ---------- background drifting clouds ----------
  const body = document.body;
  for (let i = 0; i < 5; i++) {
    const c = document.createElement('div');
    c.className = 'bg-cloud';
    const size = 40 + Math.random() * 60;
    c.style.width = size + 'px';
    c.style.height = size * 0.6 + 'px';
    c.style.top = (5 + Math.random() * 70) + '%';
    c.style.animationDuration = (25 + Math.random() * 25) + 's';
    c.style.animationDelay = (-Math.random() * 30) + 's';
    body.appendChild(c);
  }

  // ---------- pet state ----------
  let happy = 80, energy = 80, hunger = 80;
  const pet = document.getElementById('pet');
  const speech = document.getElementById('speech');
  const mouth = document.getElementById('mouth');
  const eyeL = document.getElementById('eyeL');
  const eyeR = document.getElementById('eyeR');
  const petName = 'Puffy';

  const phrases = {
    idle: ["...floating peacefully~", "Puffy hums a little tune.", "The sky feels nice today.", "Puffy blinks slowly."],
    feed: ["Yum yum! 🍪", "Puffy loves that flavor!", "Nom nom nom~"],
    play: ["Wheee! 🎈", "Puffy giggles!", "So much fun!"],
    sleep: ["Zzz... 💤", "Puffy is dozing off...", "Sweet dreams, Puffy."],
    poke: ["Hehe, that tickles!", "Puffy wiggles happily.", "Boop!"],
    low: ["Puffy seems a bit sad...", "Puffy is getting hungry...", "Puffy is sleepy..."]
  };

  function say(list) {
    speech.textContent = list[Math.floor(Math.random() * list.length)];
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function updateBars() {
    document.getElementById('happyBar').style.width = happy + '%';
    document.getElementById('energyBar').style.width = energy + '%';
    document.getElementById('hungerBar').style.width = hunger + '%';
    updateFace();
  }

  function updateFace() {
    const avg = (happy + energy + hunger) / 3;
    if (avg > 60) {
      mouth.setAttribute('d', 'M 85 122 Q 100 134 115 122');
      eyeL.setAttribute('r', 7); eyeR.setAttribute('r', 7);
    } else if (avg > 30) {
      mouth.setAttribute('d', 'M 85 124 Q 100 128 115 124');
      eyeL.setAttribute('r', 6); eyeR.setAttribute('r', 6);
    } else {
      mouth.setAttribute('d', 'M 85 128 Q 100 118 115 128');
      eyeL.setAttribute('r', 5); eyeR.setAttribute('r', 5);
    }
  }

  function spawnHeart(emoji) {
    const h = document.createElement('div');
    h.className = 'heart-pop';
    h.textContent = emoji;
    const stage = document.getElementById('stage');
    h.style.left = (40 + Math.random() * 60) + 'px';
    h.style.top = '60px';
    stage.appendChild(h);
    setTimeout(() => h.remove(), 1000);
  }

  function bounceAnim() {
    pet.classList.remove('bounce');
    void pet.offsetWidth;
    pet.classList.add('bounce');
  }

  function wiggleAnim() {
    pet.classList.remove('wiggle');
    void pet.offsetWidth;
    pet.classList.add('wiggle');
  }

  function feedPet() {
    hunger = clamp(hunger + 25);
    happy = clamp(happy + 5);
    bounceAnim();
    spawnHeart('🍪');
    say(phrases.feed);
    updateBars();
    save();
  }

  function playPet() {
    happy = clamp(happy + 20);
    energy = clamp(energy - 15);
    hunger = clamp(hunger - 5);
    bounceAnim();
    spawnHeart('🎈');
    say(phrases.play);
    updateBars();
    save();
  }

  function sleepPet() {
    energy = clamp(energy + 30);
    happy = clamp(happy + 5);
    wiggleAnim();
    spawnHeart('💤');
    say(phrases.sleep);
    updateBars();
    save();
  }

  pet.addEventListener('click', () => {
    happy = clamp(happy + 3);
    wiggleAnim();
    spawnHeart('💗');
    say(phrases.poke);
    updateBars();
    save();
  });

  // gentle stat decay + idle chatter
  setInterval(() => {
    happy = clamp(happy - 1);
    energy = clamp(energy - 1);
    hunger = clamp(hunger - 1);
    updateBars();
    if (Math.min(happy, energy, hunger) < 25) {
      say(phrases.low);
    } else if (Math.random() < 0.3) {
      say(phrases.idle);
    }
    save();
  }, 6000);

  // ---------- persistence (local only, per-browser) ----------
  function save() {
    try {
      localStorage.setItem('cloudPetState', JSON.stringify({ happy, energy, hunger }));
    } catch (e) { /* ignore */ }
  }
  function load() {
    try {
      const raw = localStorage.getItem('cloudPetState');
      if (raw) {
        const s = JSON.parse(raw);
        happy = clamp(s.happy ?? 80);
        energy = clamp(s.energy ?? 80);
        hunger = clamp(s.hunger ?? 80);
      }
    } catch (e) { /* ignore */ }
  }

  load();
  updateBars();
</script>

</body>
</html>
